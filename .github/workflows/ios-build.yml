name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    # El proyecto fue creado con Xcode 26 (LastUpgradeVersion 2600).
    # Si macos-26 no esta disponible en tu cuenta, prueba con macos-15.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build SimpMusic.app (Release, sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/SimpMusic.xcodeproj \
            -scheme SimpMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log

      - name: Empaquetar IPA
        run: |
          APP=$(find build/Build/Products -name "SimpMusic.app" -path "*Release-iphoneos*" | head -1)
          echo "App encontrada: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SimpMusic-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-ipa
          path: SimpMusic-unsigned.ipa

      - name: Subir log si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log
